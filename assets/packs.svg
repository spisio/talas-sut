<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Pack shapes for the catalogue. Colours come from the pack, pack2 and pack3 custom properties on the <svg class="pack"> that uses them. -->

  <!-- Gable-top carton: milk, cream, kefir -->
  <symbol id="carton" viewBox="0 0 100 190">
    <rect x="34" y="8" width="32" height="14" rx="2" style="fill:var(--pack2)" stroke="#d6dbe4"/>
    <polygon points="12,52 50,22 88,52" style="fill:var(--pack2)" stroke="#d6dbe4"/>
    <polygon points="12,52 50,22 50,52" fill="#000" opacity=".06"/>
    <rect x="12" y="52" width="76" height="134" rx="3" style="fill:var(--pack)"/>
    <rect x="12" y="88" width="76" height="62" style="fill:var(--pack2)"/>
    <path d="M12 150 L12 132 L30 118 L44 128 L60 110 L88 134 L88 150 Z" style="fill:var(--pack3)"/>
    <path d="M30 118 L36 123 L42 121 L44 128 L38 126 Z" fill="#fff" opacity=".9"/>
    <circle cx="70" cy="104" r="7" fill="#fff" stroke="#e5d9a8" stroke-width="2"/>
    <rect x="12" y="52" width="10" height="134" fill="#fff" opacity=".12"/>
  </symbol>

  <!-- PET bottle: airan, kefir, drinking qatiq -->
  <symbol id="pet" viewBox="0 0 70 200">
    <rect x="24" y="6" width="22" height="16" rx="3" style="fill:var(--pack3)"/>
    <path d="M26 22 H44 V36 C44 46 60 50 60 66 V186 C60 192 56 196 50 196 H20 C14 196 10 192 10 186 V66 C10 50 26 46 26 36 Z" style="fill:var(--pack2)" stroke="#dfe3ea"/>
    <rect x="10" y="84" width="50" height="76" style="fill:var(--pack)"/>
    <path d="M10 160 V146 L24 136 L36 144 L48 132 L60 142 V160 Z" style="fill:var(--pack3)" opacity=".9"/>
    <circle cx="35" cy="108" r="9" fill="#fff" opacity=".95"/>
    <rect x="14" y="66" width="6" height="120" rx="3" fill="#fff" opacity=".35"/>
  </symbol>

  <!-- Glass bottle: kymyz -->
  <symbol id="bottle" viewBox="0 0 70 210">
    <rect x="25" y="4" width="20" height="14" rx="2" style="fill:var(--pack3)"/>
    <path d="M27 18 H43 V58 C43 66 60 70 60 88 V196 C60 202 56 206 50 206 H20 C14 206 10 202 10 196 V88 C10 70 27 66 27 58 Z" style="fill:var(--pack)" stroke="#cfd6e0" stroke-width="1.5"/>
    <rect x="10" y="108" width="50" height="58" style="fill:var(--pack2)"/>
    <path d="M18 150 C24 128 30 122 35 122 C40 122 46 128 52 150" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="35" cy="135" r="4" style="fill:var(--pack3)"/>
    <rect x="10" y="166" width="50" height="5" style="fill:var(--pack3)"/>
    <rect x="14" y="88" width="6" height="108" rx="3" fill="#fff" opacity=".6"/>
  </symbol>

  <!-- Tub: qatiq, suzma, beet suzma -->
  <symbol id="tub" viewBox="0 0 120 110">
    <ellipse cx="60" cy="20" rx="52" ry="12" style="fill:var(--pack3)"/>
    <path d="M8 20 L18 98 C18 104 36 108 60 108 C84 108 102 104 102 98 L112 20 C112 27 89 32 60 32 C31 32 8 27 8 20 Z" style="fill:var(--pack)"/>
    <path d="M12 50 C30 56 90 56 108 50 L104 80 C86 86 34 86 16 80 Z" style="fill:var(--pack2)"/>
    <path d="M30 76 L44 64 L54 70 L66 58 L88 76" fill="none" style="stroke:var(--pack)" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="60" cy="18" rx="44" ry="7" fill="#fff" opacity=".35"/>
  </symbol>

  <!-- Pouch: kurut -->
  <symbol id="pouch" viewBox="0 0 100 160">
    <path d="M14 10 H86 L90 150 C90 154 87 156 84 156 H16 C13 156 10 154 10 150 Z" style="fill:var(--pack)"/>
    <rect x="14" y="10" width="72" height="12" style="fill:var(--pack2)" opacity=".85"/>
    <circle cx="50" cy="92" r="28" fill="#fff" opacity=".92"/>
    <circle cx="40" cy="86" r="8" fill="#efe6d1" stroke="#cbb88d"/>
    <circle cx="58" cy="84" r="8" fill="#efe6d1" stroke="#cbb88d"/>
    <circle cx="49" cy="101" r="8" fill="#efe6d1" stroke="#cbb88d"/>
    <rect x="10" y="132" width="80" height="10" style="fill:var(--pack3)"/>
    <rect x="10" y="40" width="80" height="12" style="fill:var(--pack2)"/>
  </symbol>

  <!-- Foil block: butter -->
  <symbol id="block" viewBox="0 0 150 90">
    <polygon points="10,30 40,12 140,12 110,30" style="fill:var(--pack3)"/>
    <polygon points="110,30 140,12 140,64 110,82" style="fill:var(--pack)" opacity=".75"/>
    <rect x="10" y="30" width="100" height="52" style="fill:var(--pack)"/>
    <rect x="10" y="44" width="100" height="24" style="fill:var(--pack2)"/>
    <path d="M22 68 L38 54 L48 60 L60 50 L80 68" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
  </symbol>

  <!-- Jar: kaymak, ghee -->
  <symbol id="jar" viewBox="0 0 100 130">
    <rect x="16" y="6" width="68" height="18" rx="4" style="fill:var(--pack3)"/>
    <rect x="12" y="24" width="76" height="100" rx="14" fill="#fff" stroke="#d6dbe4" stroke-width="1.5"/>
    <rect x="16" y="40" width="68" height="80" rx="10" style="fill:var(--pack)"/>
    <rect x="12" y="62" width="76" height="34" style="fill:var(--pack2)"/>
    <circle cx="50" cy="79" r="9" fill="#fff" opacity=".9"/>
    <rect x="20" y="32" width="6" height="84" rx="3" fill="#fff" opacity=".55"/>
  </symbol>
</svg>
